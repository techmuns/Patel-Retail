# =============================================================================
# Patel Retail Diligence — Analyze pipeline (peer concall intelligence)
#
# Ported unchanged from ceekay-munshot/dakshamconcall's analyze.yml — see
# PATEL-HANDOFF.md §21 for what changed (this header, the bot identity, and
# the removed nightly cron) versus what didn't (everything else, including
# the pipeline scripts themselves).
#
# Dispatch manually from the Actions tab with a `ticker` to fetch that
# company's latest concall, classify it into the fixed 11-section tear
# sheet, and commit the JSON back to this branch. Peers of interest for
# this diligence: Avenue Supermarts (DMART), Vishal Mega Mart, Trent,
# Spencer's Retail — Patel Retail itself is privately held and very
# likely has no Screener.in page to fetch; confirm before spending a run
# on it (§21).
#
# UNLIKE the donor, there is no nightly "refresh mode" cron here on
# purpose: this repo's use of the pipeline is a curated, one-off pull for
# five named companies, not an ongoing board that should auto-discover
# and track every listed company on BSE. Leave `ticker` blank only if you
# deliberately want refresh-mode behaviour (re-analyze every ticker
# already in public/data/tracked.json) — see analyze-company.mjs's own
# docs for what that does.
# =============================================================================

name: Analyze Concall

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker / symbol to analyze (leave blank to refresh ALL tracked companies — see the file header before doing that here)"
        required: false
        type: string
      industry:
        description: "Optional industry backfill (the scraper value is primary)"
        required: false
        type: string
      max_per_run:
        description: "Max companies this run (blank = no cap). Paces against Screener's 80-summaries/day cap; picks the least-recently-checked."
        required: false
        type: string
      bedrock_model:
        description: "Override the Claude model for this run only, e.g. anthropic.claude-sonnet-5 (blank = the default chain)"
        required: false
        type: string
      force_rebuild:
        description: "Re-classify quarters already stored instead of reusing them. Only for model/prompt comparisons — run it on a branch."
        required: false
        type: boolean
        default: false

# The commit back to the repo uses the built-in Actions token.
permissions:
  contents: write

# Don't run the same ticker twice at once; let the newest finish.
concurrency:
  group: analyze-${{ github.event.inputs.ticker || 'refresh' }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the push rebase-retry loop can rebase

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps (no-save) + Chromium
        run: |
          npm install --no-save playwright pdfjs-dist
          npx playwright install --with-deps chromium

      - name: Configure git identity
        run: |
          git config user.name "patel-retail-diligence-bot"
          git config user.email "actions@github.com"

      # Prove an LLM answers BEFORE we touch Screener. One tiny call, a fraction
      # of a paisa. Without it, a bad key burns a metered AI summary (which we
      # only get 80 of a day) and then fails — this fails first instead, and the
      # log says which provider and model answered.
      - name: Preflight — LLM key
        env:
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_REGION: ${{ secrets.BEDROCK_REGION }}
          BEDROCK_MODEL: ${{ github.event.inputs.bedrock_model || secrets.BEDROCK_MODEL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: node screener-test/check-llm.mjs

      - name: Analyze
        env:
          # Paid/premium account first (no free-tier AI-summary quota); the free
          # account below stays as the automatic fallback.
          SCREENER_PREMIUM_EMAIL: ${{ secrets.SCREENER_PREMIUM_EMAIL }}
          SCREENER_PREMIUM_PASSWORD: ${{ secrets.SCREENER_PREMIUM_PASSWORD }}
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          # LLM: Claude via Amazon Bedrock is primary (that's the key with
          # balance); OpenAI stays wired as the automatic fallback and becomes
          # primary again by setting the LLM_PROVIDER secret to "openai".
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_REGION: ${{ secrets.BEDROCK_REGION }} # optional; defaults to us-east-1
          # The run input wins over the secret, so a single A/B run can pin a
          # different model without touching the stored configuration.
          BEDROCK_MODEL: ${{ github.event.inputs.bedrock_model || secrets.BEDROCK_MODEL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }} # optional; blank = Bedrock first
          # Compared as a STRING: github.event.inputs gives "true"/"false" even for
          # a boolean input, and GitHub casts across types via number, so == true
          # would be false forever and the flag would silently never apply.
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild == 'true' && '1' || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }} # optional; llm.mjs defaults to gpt-4o
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TICKER: ${{ github.event.inputs.ticker }}
          INDUSTRY: ${{ github.event.inputs.industry }} # optional search-API backfill
          EVENT_NAME: ${{ github.event_name }} # always workflow_dispatch here — no cron trigger, see file header
          # No cron in this repo, so this only matters if `ticker` is left blank
          # for a deliberate refresh-mode run. Set the input to cap it.
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: node screener-test/analyze-company.mjs

      # Screenshots + DOM samples for debugging the scrape (always, since the
      # live Screener DOM is what we iterate against).
      - name: Upload scrape artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-artifacts-${{ github.event.inputs.ticker || 'refresh' }}
          path: screener-test/output
          if-no-files-found: ignore
          retention-days: 7
